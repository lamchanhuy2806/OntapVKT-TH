<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học viết chữ Hán: Nét cơ bản – Nét ghép – Thứ tự nét</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF4EC;--card:#fff;--ink:#2B1D16;--mute:#7A6558;--line:#E8D8C8;--brand:#B3261E;--brandtxt:#fff;--chip:#FAF1E8;--ghost:#E3D3C3;--go:#1E9E6A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1411;--card:#2A1E19;--ink:#F6EADF;--mute:#B9A292;--line:#4A382E;--brand:#FF7A6B;--brandtxt:#2B0A06;--chip:#33251E;--ghost:#4A382E;--go:#4CD08F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1411;--card:#2A1E19;--ink:#F6EADF;--mute:#B9A292;--line:#4A382E;--brand:#FF7A6B;--brandtxt:#2B0A06;--chip:#33251E;--ghost:#4A382E;--go:#4CD08F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.35rem;margin:0 0 2px;font-weight:800}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 6px;border-radius:10px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brandtxt);border-color:var(--brand)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--mute);margin:0 0 12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--go);vertical-align:-1px;margin-right:4px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.card h3{margin:0 0 2px;font-size:1.05rem}
.card h3 small{color:var(--mute);font-weight:500;font-size:.85rem}
.d{font-size:.84rem;color:var(--mute);margin:4px 0 8px}
.ex{font-size:.84rem;margin:0 0 8px}
svg.sv{width:100%;max-width:200px;display:block;margin:0 auto 8px;background:var(--chip);border:1.5px solid var(--line);border-radius:10px}
.gr{stroke:var(--line);stroke-width:.8;fill:none;stroke-dasharray:3 3}
.gh{fill:none;stroke:var(--ghost);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.in{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;animation:dr 1s ease-out}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.st{fill:var(--go);stroke:var(--card);stroke-width:1}
.nm{font-size:9px;font-weight:800;fill:var(--brand)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;background:var(--brand);color:var(--brandtxt);padding:7px 12px;border-radius:9px;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.rule{margin:0 0 10px}
.seq{font-size:.86rem;margin:6px 0}
.hide{display:none}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.draw{animation:none}}

body{background:radial-gradient(900px 400px at 85% -80px,color-mix(in srgb,var(--brand) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 20%,color-mix(in srgb,var(--go) 10%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.hd{position:relative;overflow:hidden;padding:4px 0 6px}
.wm{position:absolute;right:-6px;top:-34px;font-size:7.5rem;font-weight:800;color:var(--brand);opacity:.09;pointer-events:none;font-family:'Noto Serif SC','Songti SC',serif;animation:fl2 6s ease-in-out infinite alternate}
@keyframes fl2{to{transform:translateY(8px) rotate(3deg)}}
h1{background:linear-gradient(90deg,var(--brand),#E07A2F);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{box-shadow:0 6px 18px -10px rgba(120,60,30,.35);transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 26px -12px rgba(120,60,30,.45);border-color:var(--brand)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tab{transition:background .2s,transform .15s}.tab:active,.btn:active{transform:scale(.96)}
.btn{box-shadow:0 3px 8px -3px var(--brand);transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.08)}
.spk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer;vertical-align:middle;margin-left:4px;padding:0;transition:background .2s,color .2s,transform .15s}
.spk:hover,.spk.on{background:var(--brand);color:var(--brandtxt)}.spk:active{transform:scale(.9)}
.spk .w1,.spk .w2{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.spk.on .w1{animation:wv .7s infinite}.spk.on .w2{animation:wv .7s .25s infinite}
@keyframes wv{0%,100%{opacity:.2}50%{opacity:1}}
.hv{display:inline-block;font-size:.76rem;font-weight:700;color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);border-radius:999px;padding:1px 10px;margin:0 0 6px}
.zr i{color:var(--mute)}
.exc{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;font:inherit;font-size:1.05rem;padding:1px 8px;margin:0 4px 0 0;cursor:pointer;transition:transform .15s,border-color .2s}
.exc:hover{transform:translateY(-2px);border-color:var(--brand)}
.in{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.flow{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 6;animation:fw 1s linear infinite}
@keyframes fw{to{stroke-dashoffset:-16}}
.ring{fill:none;stroke:var(--go);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-out infinite}
@keyframes pl{from{transform:scale(.8);opacity:.9}to{transform:scale(2.6);opacity:0}}
.pen{fill:var(--brand);animation:pf 1.1s forwards}
@keyframes pf{0%,80%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:.84rem;max-width:90%;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.s{opacity:1}
.list:not(.hide){animation:fi .3s}@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.card,.wm,.flow,.ring,.pen,.list{animation:none!important}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><span class="wm" aria-hidden="true">永</span><h1>Học viết chữ Hán</h1>
  <p class="sub">Từ nét cơ bản đến nét ghép, rồi quy tắc thứ tự nét. Hình vẽ minh hoạ dạng sơ đồ, nét thật có thể hơi khác tuỳ phông chữ.</p></div>
  <div class="legend"><span><span class="dot"></span>Chấm xanh = điểm đặt bút</span><span>Số đỏ = thứ tự nét</span><span>Mũi tên đỏ = hướng đi</span><span>Bấm nút loa để nghe cách đọc</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="b" aria-selected="true">Nét cơ bản</button>
    <button class="tab" role="tab" data-tab="c" aria-selected="false">Nét ghép</button>
    <button class="tab" role="tab" data-tab="r" aria-selected="false">Thứ tự nét</button>
  </div>
  <div id="b" class="list"></div><div id="c" class="list hide"></div><div id="r" class="list hide"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>

{n:"横斜钩",p:"héngxiégōu",v:"M20 26 L52 26 Q70 52 74 80 Q76 88 66 84",d:"Ngang rồi chuyển sang xiên xuống phải, cuối nét hất móc.",e:"风 飞 气"}];
/* Chữ mẫu: mỗi nét có tên và đường vẽ */
const CH={
"十":[["横","M18 50 L82 50"],["竖","M50 18 L50 84"]],
"人":[["撇","M48 18 Q40 55 18 82"],["捺","M44 42 Q58 66 84 82"]],
"三":[["横","M28 26 L72 26"],["横","M36 50 L64 50"],["横","M20 76 L80 76"]],
"川":[["撇","M30 22 Q28 52 20 80"],["竖","M50 20 L50 82"],["竖","M78 20 L78 82"]],
"小":[["竖钩","M50 18 L50 78 Q50 84 40 82"],["点","M30 40 L22 62"],["点","M70 40 L78 62"]],
"山":[["竖","M50 22 L50 80"],["竖折","M24 44 L24 80 L76 80"],["竖","M76 44 L76 80"]],
"月":[["撇","M36 18 Q30 56 20 84"],["横折钩","M36 18 L72 18 L72 80 Q72 88 62 84"],["横","M36 42 L72 42"],["横","M36 64 L72 64"]],
"田":[["竖","M24 22 L24 80"],["横折","M24 22 L76 22 L76 80"],["横","M24 50 L76 50"],["竖","M50 22 L50 80"],["横","M24 80 L76 80"]],
"中":[["竖","M26 36 L26 68"],["横折","M26 36 L74 36 L74 68"],["横","M26 68 L74 68"],["竖","M50 16 L50 88"]],
"木":[["横","M18 40 L82 40"],["竖","M50 18 L50 86"],["撇","M48 44 Q40 64 20 80"],["捺","M52 44 Q62 64 82 80"]],
"大":[["横","M18 40 L82 40"],["撇","M50 22 Q48 58 16 84"],["捺","M50 46 Q62 68 84 84"]]};
const RU=[
["先横后竖","Ngang trước, sổ sau","十"],["先撇后捺","Phẩy trước, mác sau","人"],["从上到下","Từ trên xuống dưới","三"],
["从左到右","Từ trái sang phải","川"],["先中间后两边","Giữa trước, hai bên sau","小"],["先中间后两边","Giữa trước, hai bên sau (chữ lớn hơn)","山"],
["先外后内","Bao ngoài trước, bên trong sau","月"],["先里头后封口","Viết bên trong rồi mới đóng nét đáy","田"],
["竖贯穿最后写","Nét sổ xuyên giữa viết sau cùng","中"],["综合","Ngang, phẩy, mác theo thứ tự","大"],["综合","Ngang, sổ, phẩy, mác","木"]];
const HV={"横":"hoành","竖":"thụ","撇":"phiệt","捺":"nại","点":"điểm","提":"đề","横折":"hoành chiết","横撇":"hoành phiệt","横钩":"hoành câu","竖折":"thụ chiết","竖弯":"thụ loan","竖提":"thụ đề","竖钩":"thụ câu","撇折":"phiệt chiết","撇点":"phiệt điểm","横折钩":"hoành chiết câu","横折提":"hoành chiết đề","斜钩":"tà câu","卧钩":"ngọa câu","竖弯钩":"thụ loan câu","横折弯钩":"hoành chiết loan câu","横斜钩":"hoành tà câu","十":"thập","人":"nhân","三":"tam","川":"xuyên","小":"tiểu","山":"sơn","月":"nguyệt","田":"điền","中":"trung","大":"đại","木":"mộc"};
const PY={"十":"shí","人":"rén","三":"sān","川":"chuān","小":"xiǎo","山":"shān","月":"yuè","田":"tián","中":"zhōng","大":"dà","木":"mù"};
const RP={"先横后竖":"xiān héng hòu shù","先撇后捺":"xiān piě hòu nà","从上到下":"cóng shàng dào xià","从左到右":"cóng zuǒ dào yòu","先中间后两边":"xiān zhōngjiān hòu liǎngbiān","先外后内":"xiān wài hòu nèi","先里头后封口":"xiān lǐtou hòu fēngkǒu","竖贯穿最后写":"shù guànchuān zuìhòu xiě","综合":"zōnghé"};
const spk=t=>'<button class="spk" data-say="'+t+'" aria-label="Nghe cách đọc '+t+'" title="Nghe cách đọc"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="w1" d="M16 9.5a3.5 3.5 0 010 5"/><path class="w2" d="M18.6 6.8a7.5 7.5 0 010 10.4"/></svg></button>';
let voice=null;
function lv(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if(window.speechSynthesis){lv();speechSynthesis.onvoiceschanged=lv}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),3400)}
function say(txt,btn){
  if(!window.speechSynthesis){toast('Trình duyệt này chưa hỗ trợ phát âm.');return}
  speechSynthesis.cancel();lv();
  if(!voice&&speechSynthesis.getVoices().length)toast('Máy chưa có giọng tiếng Trung. Hãy thêm giọng Chinese (Mandarin) trong cài đặt Text-to-speech.');
  const u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';u.rate=.7;if(voice)u.voice=voice;
  if(btn){u.onstart=()=>btn.classList.add('on');u.onend=u.onerror=()=>btn.classList.remove('on')}
  speechSynthesis.speak(u);
}
let uid=0;const ST={},TM={};
function sv(id,s,k,anim,arrow){
  const a='a'+(uid++);let g='<defs><marker id="'+a+'" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--brand)"/></marker></defs>'+
   '<path class="gr" d="M2 2H98V98H2Z M50 2V98 M2 50H98 M2 2L98 98 M98 2L2 98"/>';
  s.forEach(x=>g+='<path class="gh" d="'+x[1]+'"'+(arrow?' marker-end="url(#'+a+')"':'')+'/>');
  for(let i=0;i<k;i++)g+='<path class="in'+(i===k-1&&anim?' draw':'')+'" pathLength="1" d="'+s[i][1]+'"/>';
  const nx=k<s.length?s[k][1]:null;
  if(nx){const m=nx.match(/-?\d+(\.\d+)?/g);g+='<path class="flow" d="'+nx+'"/><circle class="ring" cx="'+m[0]+'" cy="'+m[1]+'" r="3.8"/>'}
  if(anim&&k)g+='<circle class="pen" r="3.4"><animateMotion dur="1s" fill="freeze" path="'+s[k-1][1]+'"/></circle>';
  const n=arrow?s.length:k;
  for(let i=0;i<n;i++){const m=s[i][1].match(/-?\d+(\.\d+)?/g);g+='<circle class="st" cx="'+m[0]+'" cy="'+m[1]+'" r="3.8"/>'+(arrow?'':'<text class="nm" x="'+(+m[0]-8)+'" y="'+(+m[1]-4)+'">'+(i+1)+'</text>')}
  return '<svg class="sv" viewBox="0 0 100 100" role="img" aria-label="Sơ đồ nét">'+g+'</svg>';
}
function card(id){
  const c=ST[id],k=c.k,s=c.s;
  const names=c.multi?'<p class="seq">'+s.map((x,i)=>(i<k?'<b>':'<span style="color:var(--mute)">')+(i+1)+' '+x[0]+(i<k?'</b>':'</span>')).join(' → ')+'</p>':'';
  return '<h3>'+c.t+'</h3>'+(c.hv?'<span class="hv">Hán Việt: '+c.hv+'</span>':'')+(c.d?'<p class="d">'+c.d+'</p>':'')+sv(id,s,k,c.anim,!c.multi)+names+(c.e?'<p class="ex">Ví dụ: '+c.e.split(' ').map(x=>'<button class="exc" data-say="'+x+'" aria-label="Nghe '+x+'">'+x+'</button>').join('')+'</p>':'')+
   '<div class="row"><button class="btn" data-a="play" data-id="'+id+'">▶ Xem viết</button>'+(c.multi?'<button class="btn g" data-a="next" data-id="'+id+'">Nét tiếp</button>':'')+'<button class="btn g" data-a="reset" data-id="'+id+'">Làm lại</button></div>';
}
function add(box,id,o){ST[id]=Object.assign({k:0,anim:false},o);const el=document.createElement('div');el.className='card';el.style&&el.style.setProperty('--d',($(box).children.length*45)+'ms');el.id='c'+id;$(box).appendChild(el);el.innerHTML=card(id)}
BA.forEach((x,i)=>add('#b','b'+i,{s:[[x.n,x.v]],t:x.n+' <small>'+x.p+'</small>'+spk(x.n),hv:HV[x.n],d:x.d,e:x.e}));
CO.forEach((x,i)=>add('#c','c'+i,{s:[[x.n,x.v]],t:x.n+' <small>'+x.p+'</small>'+spk(x.n),hv:HV[x.n],d:x.d,e:x.e}));
RU.forEach((r,i)=>add('#r','r'+i,{s:CH[r[2]],multi:true,t:r[2]+' <small>'+PY[r[2]]+'</small>'+spk(r[2]),hv:HV[r[2]],d:r[1]+'.<br><span class="zr"><b>'+r[0]+'</b> <i>'+RP[r[0]]+'</i></span>'+spk(r[0])}));
function show(id){const c=ST[id];$('#c'+id).innerHTML=card(id)}
document.addEventListener('click',e=>{
  const sp=e.target.closest('[data-say]');if(sp){say(sp.dataset.say,sp);return}
  const b=e.target.closest('button[data-a]');if(!b)return;
  const id=b.dataset.id,c=ST[id],n=c.s.length;clearInterval(TM[id]);
  if(b.dataset.a==='reset'){c.k=0;c.anim=false;show(id)}
  else if(b.dataset.a==='next'){c.k=c.k>=n?1:c.k+1;c.anim=true;show(id)}
  else{c.k=1;c.anim=true;show(id);if(n>1)TM[id]=setInterval(()=>{if(c.k>=n){clearInterval(TM[id]);return}c.k++;show(id)},1100)}
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t===b));
  ['b','c','r'].forEach(id=>$('#'+id).classList.toggle('hide',id!==b.dataset.tab));
});
</script>
</body>
